services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    depends_on:
      cms:
        condition: service_started
    environment:
      VITE_CMS_URL: http://localhost:1337
    ports:
      - "5173:5173"
    volumes:
      - ./:/app
      - frontend_node_modules:/app/node_modules
    command: npm run dev

  cms:
    build:
      context: ./cms
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_CLIENT: postgres
      DATABASE_HOST: db
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-page}
      DATABASE_USERNAME: ${POSTGRES_USER:-page}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-page}
      DATABASE_SSL: "false"
      APP_KEYS: ${APP_KEYS}
      API_TOKEN_SALT: ${API_TOKEN_SALT}
      ADMIN_JWT_SECRET: ${ADMIN_JWT_SECRET}
      TRANSFER_TOKEN_SALT: ${TRANSFER_TOKEN_SALT}
      JWT_SECRET: ${JWT_SECRET}
      HOST: 0.0.0.0
      PORT: 1337
    ports:
      - "1337:1337"
    volumes:
      - ./cms:/opt/app
      - cms_node_modules:/opt/app/node_modules
      - strapi_uploads:/opt/app/public/uploads
    command: npm run develop

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-page}
      POSTGRES_USER: ${POSTGRES_USER:-page}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-page}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-page} -d ${POSTGRES_DB:-page}"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  frontend_node_modules:
  cms_node_modules:
  postgres_data:
  strapi_uploads:
